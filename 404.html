<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Hindva Healthcare</title>
  <meta name="description" content="The page you're looking for doesn't exist. Return to Hindva Healthcare homepage.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="images/logo/favicon-circle.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      background: #f0f4f8;
      color: #1a1a2e;
      overflow: hidden;
      position: relative;
    }

    /* Animated gradient background blobs */
    .bg-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      pointer-events: none;
      z-index: 0;
    }

    .bg-blob-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(13, 71, 161, 0.12) 0%, transparent 70%);
      top: -150px;
      right: -100px;
      animation: blobFloat1 15s ease-in-out infinite;
    }

    .bg-blob-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(0, 191, 88, 0.10) 0%, transparent 70%);
      bottom: -120px;
      left: -80px;
      animation: blobFloat2 18s ease-in-out infinite;
    }

    .bg-blob-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 153, 204, 0.08) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: blobFloat3 12s ease-in-out infinite;
    }

    @keyframes blobFloat1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-40px, 30px) scale(1.1); }
      66% { transform: translate(30px, -20px) scale(0.95); }
    }

    @keyframes blobFloat2 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(50px, -40px) scale(1.08); }
      66% { transform: translate(-30px, 20px) scale(0.92); }
    }

    @keyframes blobFloat3 {
      0%, 100% { transform: translate(-50%, -50%) scale(1); }
      50% { transform: translate(-50%, -50%) scale(1.15); }
    }

    .container {
      text-align: center;
      max-width: 580px;
      padding: 50px 30px;
      position: relative;
      z-index: 1;
    }

    /* Animated 404 number */
    .error-code {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(100px, 20vw, 180px);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #0d47a1, #0099cc, #00bf58);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      position: relative;
      animation: floatUp 3s ease-in-out infinite;
      letter-spacing: -4px;
    }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    /* Glowing line accent */
    .accent-line {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, #0d47a1, #00bf58);
      border-radius: 4px;
      margin: 0 auto 30px;
      animation: lineGlow 2s ease-in-out infinite alternate;
    }

    @keyframes lineGlow {
      0% { box-shadow: 0 0 10px rgba(13, 71, 161, 0.3); width: 80px; }
      100% { box-shadow: 0 0 25px rgba(0, 191, 88, 0.4); width: 120px; }
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 16px;
    }

    p {
      font-size: 16px;
      color: #666;
      line-height: 1.7;
      margin-bottom: 40px;
      max-width: 460px;
      margin-left: auto;
      margin-right: auto;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 40px;
      background: linear-gradient(135deg, #0d47a1, #00bf58);
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 50px;
      letter-spacing: 1px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 6px 30px rgba(13, 71, 161, 0.3);
    }

    .btn-home:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 12px 40px rgba(13, 71, 161, 0.4);
    }

    .btn-home::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transition: none;
    }

    .btn-home:hover::before {
      animation: shimmer404 0.6s ease forwards;
    }

    @keyframes shimmer404 {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .btn-home svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      transition: transform 0.3s ease;
    }

    .btn-home:hover svg {
      transform: translateX(-3px);
    }

    /* Brand footer */
    .brand-footer {
      margin-top: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      opacity: 0.6;
    }

    .brand-footer img {
      height: 28px;
      width: auto;
    }

    .brand-footer span {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
    }

    /* Floating medical particles */
    .particle {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      opacity: 0.08;
    }

    .particle-1 {
      width: 20px;
      height: 20px;
      border: 2px solid #0d47a1;
      border-radius: 50%;
      top: 15%;
      left: 10%;
      animation: particleDrift 8s ease-in-out infinite;
    }

    .particle-2 {
      width: 2px;
      height: 16px;
      background: #00bf58;
      top: 25%;
      right: 15%;
      animation: particleDrift 10s ease-in-out infinite reverse;
      transform: rotate(45deg);
    }

    .particle-2::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 2px;
      background: #00bf58;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .particle-3 {
      width: 14px;
      height: 14px;
      border: 2px solid #0099cc;
      border-radius: 3px;
      bottom: 20%;
      right: 12%;
      animation: particleDrift 12s ease-in-out infinite;
      transform: rotate(45deg);
    }

    .particle-4 {
      width: 8px;
      height: 8px;
      background: #0d47a1;
      border-radius: 50%;
      bottom: 30%;
      left: 8%;
      animation: particleDrift 9s ease-in-out infinite reverse;
    }

    @keyframes particleDrift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      25% { transform: translate(20px, -15px) rotate(90deg); }
      50% { transform: translate(-10px, 20px) rotate(180deg); }
      75% { transform: translate(15px, 10px) rotate(270deg); }
    }
  </style>
</head>

<body>
  <!-- Background blobs -->
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>

  <!-- Floating particles -->
  <div class="particle particle-1"></div>
  <div class="particle particle-2"></div>
  <div class="particle particle-3"></div>
  <div class="particle particle-4"></div>

  <div class="container">
    <div class="error-code">404</div>
    <div class="accent-line"></div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back to exploring quality healthcare solutions.</p>
    <a href="/" class="btn-home">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Back to Home
    </a>
    <div class="brand-footer">
      <img src="images/logo/hindva-favicon-final.png" alt="Hindva Healthcare"
        onerror="this.style.display='none'">
      <span>Hindva Healthcare</span>
    </div>
  </div>
</body>

</html>
